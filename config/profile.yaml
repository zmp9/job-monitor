# Scoring weights and cutoff. Edited by dashboard.py; src/scoring.py holds the
# same values as defaults, so removing a key here falls back rather than breaking.
weights:
  positive_title: 18        # sector keyword in the title
  positive_body: 6          # sector keyword in description/department only
  profile_signal: 4         # something specific to my background
  preferred_location: 8     # NYC / SF / Greenwich etc.
  timing_boost: 15          # title names the 2027 cycle explicitly
  negative_title: -30       # off-track keyword in the title
  negative_body: -6         # off-track keyword in the body
  catchall_base: 10         # cleared the gate on title shape alone
  internship: 25            # title is an internship — the actual target

threshold: 45               # notify at or above this

timing:
  target: "Summer 2027 internship"
  grad_window: ["2027-12", "2028-08"]
  # Hard exclusions matched against the title.
  # NOTE: these are skipped when the title is an internship, so
  # "Product Manager Intern" survives but "Strategy Manager" does not.
  exclude:
    - senior
    - sr
    - staff
    - principal
    - director
    - lead
    - manager
    - partner
    - "vice president"
    - "vp,"
    - "head of"
    - experienced hire
    - "degree required in hand"
  # Titles containing these get a timing bonus.
  boost:
    - "2027"
    - "summer 2027"

location:
  allowed: [United States]
  preferred: [New York, "New York City", NYC, "San Francisco", "SF", "Bay Area", Greenwich, Stamford, Boston, Chicago]
  remote_ok: false

sectors:   # all weighted EQUALLY — no sector multipliers
  - consulting
  - aviation / industrials
  - finance          # broad: S&T, IB, wealth/asset mgmt, markets — all fine
  - technology       # business-side only

