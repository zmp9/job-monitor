# Scoring weights and cutoff. Edited by dashboard.py; src/scoring.py holds the
# same values as defaults, so removing a key here falls back rather than breaking.
weights:
  positive_title: 15        # sector keyword in the title
  positive_body: 5          # sector keyword in description/department only
  requirement_match: 6      # resume skill named in the JD's requirements block
  requirement_miss: -10     # JD requires a major/skill I don't have
  profile_signal: 3         # something specific to my background
  preferred_location: 6     # NYC / SF / Greenwich etc.
  timing_boost: 12          # title names the 2027 cycle explicitly
  off_season: -18           # Fall/Winter/Spring term when Summer is the target
  negative_title: -30       # off-track keyword in the title
  negative_body: -6         # off-track keyword in the body
  catchall_base: 8          # cleared the gate on title shape alone
  internship: 18            # title is an internship — the actual target

threshold: 40               # notify at or above this

# Hard exclusions matched against the title.
# NOTE: `exclude` is skipped when the title is an internship, so
# "Product Manager Intern" survives but "Strategy Manager" does not.
timing:
  target: Summer 2027 internship
  grad_window:
  - 2027-12
  - 2028-08
  preferred_season: summer
  internship_only: true
  min_cycle_year: 2027
  exclude:
  - senior
  - sr
  - staff
  - principal
  - director
  - lead
  - manager
  - partner
  - vice president
  - vp,
  - head of
  - experienced hire
  - degree required in hand
  boost:
  - '2027'
  - summer 2027

location:
  allowed:
  - United States
  preferred:
  - New York
  - New York City
  - NYC
  - San Francisco
  - SF
  - Bay Area
  - Greenwich
  - Stamford
  - Boston
  - Chicago
  - Washington
  - Washington DC
  - Arlington
  - McLean
  remote_ok: false

