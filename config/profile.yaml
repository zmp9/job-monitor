  - electrical engineer
  - firmware
  - FPGA
  # Added after the fund/prop-shop boards went in — these titles were scoring
  # high on the Summer 2027 timing boost alone.
  - hardware engineer
  - platform engineer
  - manufacturing engineer
  - controls engineer
  - systems engineer
  - test engineer
  - reliability engineer
  - machine learning
  - quantitative research
  - quantitative development
  - quantitative developer
  - quantitative trader
  - research scientist
  - data scientist
  - civil engineer
  - structural engineer
  - silicon engineer
  - software engineering
  - aerospace engineer
  - industrial engineer
  - quality engineer

# Strong negatives: if present in the TITLE, exclude outright (never scored).
# Unlike timing.exclude, these are NOT waived for internship titles — that is why
# phd/mba live here, so "PhD Research Scientist Intern" is still dropped.
strong_negatives:
  - phd
  - mba
  - software engineer
  - backend engineer
  - frontend engineer
  - full-stack engineer
  - machine learning engineer
  - data engineer
  - devops
  - site reliability
  - quantitative researcher
  - quant trader

