# Copy to config/applicant.yaml and fill in. That file is gitignored — it holds
# personal data (phone, GPA, test scores) that should not live in git history
# even in a private repo.
#
# Only stable facts belong here. Anything role-specific stays a per-application
# decision you make at review time.

identity:
  first_name: Zaid
  last_name: Patankar
  preferred_name: Zaid
  email: zmp9@cornell.edu
  phone: ""                       # +1 555 555 5555
  location: "Ithaca, NY"
  linkedin: ""                    # https://www.linkedin.com/in/...
  website: ""                     # portfolio / personal site, optional

education:
  school: Cornell University
  degree: "Bachelor's"
  major: ""                       # e.g. Industrial and Labor Relations
  minor: ""
  grad_month: "2028-05"           # used to answer "graduation year/date"
  grad_year: "2028"
  gpa: ""                         # e.g. 3.75
  sat: ""                         # optional; several finance forms ask
  act: ""

work_authorization:
  # Phrased as most ATS forms ask it, so answers map cleanly.
  authorized_to_work_us: true
  will_require_sponsorship: false

files:
  # Absolute paths. File uploads always stay manual — the browser controls that
  # picker and no autofill can set it for you. These are here so the packet can
  # tell you exactly which file to grab.
  resume: "~/Documents/recruiting/Zaid_Patankar_Resume.pdf"
  transcript: "~/Documents/recruiting/Cornell_Transcript.pdf"
  cover_letter_template: ""       # optional

defaults:
  # Free-text answers that recur across applications.
  how_did_you_hear: "Company careers page"

  # Answer "would you like to be considered for other opportunities" as Yes.
  consider_other_opportunities: true

  # Answer acknowledgement boxes — "confirm receipt of our privacy policy",
  # "I acknowledge", terms-and-conditions — as Yes.
  # Scoped to receipts and acknowledgements. Questions of the form "I certify
  # the information provided is accurate" stay manual: that one is a claim about
  # what you just entered, so it wants your eyes on the filled form first.
  confirm_acknowledgements: true

# Voluntary self-identification. These are statements about you, so nothing here
# is guessed — fill in what is true, or leave a field blank to answer it on the
# form. Anything blank is left untouched by both the packet and the autofill.
#
# Values must match the option text on the form closely enough to select it;
# the standard EEO wording is listed under each.
self_identification:
  # Male | Female | Decline to self-identify
  gender: ""

  # Hispanic or Latino | White | Black or African American | Asian |
  # Native Hawaiian or Other Pacific Islander | American Indian or Alaska Native |
  # Two or More Races | Decline to self-identify
  race_ethnicity: ""

  # I am not a protected veteran |
  # I identify as one or more of the classifications of a protected veteran |
  # I don't wish to answer
  veteran_status: ""

  # Federal form CC-305 wording:
  # Yes, I have a disability, or have had one in the past |
  # No, I do not have a disability and have not had one in the past |
  # I do not want to answer
  disability_status: ""
