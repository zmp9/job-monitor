name: job scan (7am + 7pm ET)

on:
  schedule:
    # 07:00 and 19:00 ET. GitHub cron is UTC-only and does not follow daylight
    # saving, so these are correct Mar–Nov (EDT, UTC-4) and land an hour early
    # — 06:00 and 18:00 — through the winter. Shift both by +1 to correct that,
    # or leave it: an hour's drift on a daily digest costs nothing.
    #
    # Cron here is best-effort; GitHub delays runs under load, so don't treat
    # the timestamp as exact.
    - cron: "0 11 * * *"      # 07:00 ET
    - cron: "0 23 * * *"      # 19:00 ET
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print instead of sending"
        type: boolean
        default: false
      digest:
        description: "Force the weekly gated digest"
        type: boolean
        default: false
      test_email:
        description: "Send a single test email and report the result (skips scanning)"
        type: boolean
        default: false

concurrency:
  group: daily-job-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # needed to commit the state files back
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run scan
        env:
          EMAIL_BACKEND: ${{ vars.EMAIL_BACKEND || 'resend' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          # Phone push. Topic is secret because ntfy topics are unauthenticated.
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SCORE_THRESHOLD: ${{ vars.SCORE_THRESHOLD || '' }}
        run: |
          python main.py \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.digest && '--digest' || '' }} \
            ${{ inputs.test_email && '--test-email' || '' }}

      - name: Commit state
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name  "job-monitor[bot]"
          git config user.email "job-monitor@users.noreply.github.com"
          git add state/ MATCHES.md
          if git diff --staged --quiet; then
            echo "no state change"
          else
            # Two runs a day, so stamp the hour — otherwise both commits
            # on a given day carry an identical message.
            git commit -m "state: $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            # Another run may have pushed first; rebase rather than fail the job.
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push
          fi
